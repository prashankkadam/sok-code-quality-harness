# Prices are USD per million tokens and are only used for the cost log.
main_grid: [op, oss, g31, g26]
extended_grid: [gpt61, gem4, kimi3, glm53, qwen38, mimo26, dsv41f, dsv4f, minimax3]

models:
  op:
    name: Claude Opus 5.5
    backend: anthropic
    model: claude-opus-5-5
    effort: medium
    always_thinks: true
    price: {input: 4.0, output: 20.0}
    cutoff: "2026-06"
  oss:
    name: gpt-oss-120b
    backend: fireworks
    model: accounts/fireworks/models/gpt-oss-120b
    effort: medium
    price: {input: 0.15, output: 0.60}
    cutoff: "2024-06"
  g31:
    name: Gemma 4 31B IT
    backend: fireworks
    model: accounts/fireworks/models/gemma-4-31b-it#accounts/sok-code-quality/deployments/gemma-4-31b-it
    hf_id: google/gemma-4-31b-it
    tunable: true
    price: {input: 0.90, output: 0.90}
    cutoff: "2025-01"
  g26:
    name: Gemma 4 26B-A4B IT
    backend: fireworks
    model: accounts/fireworks/models/gemma-4-26b-a4b-it#accounts/sok-code-quality/deployments/gemma-4-26b-a4b-it
    hf_id: google/gemma-4-26b-a4b-it
    tunable: true
    price: {input: 0.50, output: 0.50}
    cutoff: "2025-01"
  gpt61:
    name: GPT-6.1 Sol
    backend: vercel
    model: openai/gpt-6.1-sol
    provider: openai
    effort: medium
    closed: true
    price: {input: 2.5, output: 15.0}
    cutoff: "2026-04"
  gem4:
    name: Gemini 4 Argon
    backend: vercel
    model: google/gemini-4-argon
    provider: vertex
    effort: medium
    closed: true
    price: {input: 2.0, output: 12.0}
    cutoff: "2026-03"
  kimi3: {name: Kimi K3, backend: fireworks, model: accounts/fireworks/models/kimi-k3, price: {input: 0.6, output: 2.5}}
  glm53: {name: GLM-5.3, backend: fireworks, model: accounts/fireworks/models/glm-5p3, price: {input: 0.55, output: 2.2}}
  qwen38: {name: Qwen3.8-Max, backend: fireworks, model: accounts/fireworks/models/qwen3p8-max, price: {input: 1.2, output: 6.0}}
  mimo26: {name: MiMo-V2.6-Pro, backend: fireworks, model: accounts/fireworks/models/mimo-v2p6-pro, price: {input: 0.5, output: 2.0}}
  dsv41f: {name: DeepSeek V4.1-Flash, backend: fireworks, model: accounts/fireworks/models/deepseek-v4p1-flash, price: {input: 0.27, output: 1.1}}
  dsv4f: {name: DeepSeek V4-Flash, backend: fireworks, model: accounts/fireworks/models/deepseek-v4-flash, price: {input: 0.27, output: 1.1}}
  minimax3: {name: MiniMax M3, backend: fireworks, model: accounts/fireworks/models/minimax-m3, price: {input: 0.3, output: 1.2}}

sampling:
  open: {temperature: 0.2, best_of_n_temperature: 0.8}
  closed_min_samples: 3
  seeds: [11, 23, 37]
  max_tokens: 8192

judge: op
judge2: gpt61
